name: DispecinkPhone
options:
  bundleIdPrefix: cz.erikkarasek
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Dispecink:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.erikkarasek.dispecink.phone
        INFOPLIST_KEY_CFBundleDisplayName: Wisp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wisp
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: cz.erikkarasek.dispecink.phone
            CFBundleURLSchemes: [dispecink]
        BGTaskSchedulerPermittedIdentifiers: [cz.erikkarasek.dispecink.refresh]
        NSFocusStatusUsageDescription: Aby Wisp při soustředění mlčel o všem kromě povolení, která po tobě Claude chce.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: DispecinkWidget
  DispecinkWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.erikkarasek.dispecink.phone.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wisp
        INFOPLIST_KEY_NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Wisp
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
